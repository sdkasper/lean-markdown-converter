name: Test Suite

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: pytest - Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Git LFS is used for .exe and .zip — skip LFS objects in CI
          # (test fixtures are checked in as plain files, not LFS objects)
          lfs: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install pytest and coverage tools
        run: pip install pytest pytest-cov

      - name: Run test suite with coverage
        # -m "not slow" skips the audio integration test (real-speech M4A
        # fixture): it needs real ffmpeg/ffprobe binaries (LFS objects,
        # lfs: false above) and Google's Web Speech API over the network.
        # It remains a local/pre-release check where those exist.
        # Coverage measures the v2 layout (core/ + thin cli/ and gui/
        # presentation layers). The fast suite measures 77% locally; the
        # gate is set below that with headroom. gui/main.py (0%) is the
        # frozen-only PyInstaller entry point + selftest, exercised by the
        # mandatory post-build `--selftest` instead.
        run: >
          pytest tests/
          -m "not slow"
          --cov=core
          --cov=cli
          --cov=gui
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=70
        env:
          # Prevent tkinter from trying to connect to a display in headless CI
          # (imports still work; we just avoid instantiating Tk windows)
          DISPLAY: ""

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: false
